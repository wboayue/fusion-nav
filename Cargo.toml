[package]
name = "fusion-nav"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Wil Boayue <wil@wsbsolutions.com>"]
description = "A no_std, allocation-free 15-state error-state Kalman filter for inertial navigation. Fuses IMU with GNSS, barometric altitude, and magnetometer heading. For attitude or altitude only, see fusion-ahrs and fusion-altitude."
readme = "README.md"
homepage = "https://github.com/wboayue/fusion-nav/"
repository = "https://github.com/wboayue/fusion-nav/"
documentation = "https://docs.rs/fusion-nav"
license = "MIT"
keywords = ["eskf", "navigation", "sensor-fusion", "gnss", "embedded"]
categories = ["embedded", "no-std", "algorithms", "science"]
# `data/flight.truth.csv` is 31 KB of the packaged crate and nothing on the published side reads
# it: scoring a replay against truth happens in this repository, never in a dependent's build.
# `data/flight.csv` stays, because `cargo run --example replay` is the first thing a reader runs.
exclude = ["AGENTS.md", "VALIDATION.md", "data/flight.truth.csv", "validation/"]

# `panic-check` builds a bare-metal binary that links the whole public API, so CI can prove
# nothing in it reaches `core::panicking`. It is a workspace member for one reason: a second
# `Cargo.lock` would let the gate run against a different `nalgebra` than the library ships.
# It is not a default member, so `cargo test`, `cargo clippy` and `cargo package` at the root
# never try to build a `no_std` binary for the host. See `panic-check/run.sh`.
[workspace]
members = [".", "panic-check"]
default-members = ["."]

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
defmt = { version = "1", optional = true }

# `defmt::Format` on the outcomes, the state and the diagnostics, for a target that logs through
# `defmt` rather than `core::fmt`. Optional, so the default build keeps its one dependency.
[features]
defmt = ["dep:defmt"]

[dev-dependencies]
