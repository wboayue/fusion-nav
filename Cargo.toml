[package]
name = "fusion-nav"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Wil Boayue <wil@wsblabs.com>"]
description = "A no_std, allocation-free 15-state error-state Kalman filter for inertial navigation. Fuses IMU with GNSS position, velocity, dual-antenna heading and course, barometric altitude, and magnetometer heading. For attitude or altitude only, see fusion-ahrs and fusion-altitude."
readme = "README.md"
repository = "https://github.com/wboayue/fusion-nav/"
documentation = "https://docs.rs/fusion-nav"
license = "MIT"
keywords = ["eskf", "kalman", "sensor-fusion", "gnss", "embedded"]
categories = ["embedded", "no-std", "algorithms", "aerospace::unmanned-aerial-vehicles"]
# An allowlist, so a new file in the repository stays out of the packaged crate until someone
# argues it in. The rest of the repository is how the crate was validated, not what it is, and the
# packaged docs reach it by absolute URL. `data/flight.csv` ships because `cargo run --example
# replay` is the first thing a reader runs, and it and `data/flight.config.rs` are `include_str!`ed
# by the replay harness's tests; `data/flight.truth.csv` does not, since scoring happens here.
include = [
    "/src/**",
    "/examples/**",
    "/data/flight.csv",
    "/data/flight.config.rs",
    "/README.md",
    "/GUIDE.md",
    "/MIGRATING.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# docs.rs renders the crate for a Cortex-M7, the target it exists for, with `defmt`'s impls shown
# beside the default `magnetic-model`; the host target follows so the docs a desktop reader lands on
# are the same API. `docsrs` turns on `doc_cfg`, which labels what each feature adds.
[package.metadata.docs.rs]
features = ["defmt"]
targets = ["thumbv7em-none-eabihf", "x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

# `panic-check` builds a bare-metal binary that links the whole public API, so CI can prove
# nothing in it reaches `core::panicking`. It is a workspace member for one reason: a second
# `Cargo.lock` would let the gate run against a different `nalgebra` than the library ships.
# It is not a default member, so `cargo test`, `cargo clippy` and `cargo package` at the root
# never try to build a `no_std` binary for the host. See `panic-check/run.sh`.
#
# `bench` holds the host benchmarks, a member rather than a dev-dependency here because
# criterion's features would reach every test and example build (see `bench/Cargo.toml`).
[workspace]
members = [".", "bench", "onboard", "panic-check"]
default-members = ["."]

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
defmt = { version = "1", optional = true }

# `defmt::Format` on the outcomes, the state and the diagnostics, for a target that logs through
# `defmt` rather than `core::fmt`. Optional, so the default build keeps its one dependency.
[features]
default = ["magnetic-model"]
defmt = ["dep:defmt"]
# Magnetic declination from PX4's World Magnetic Model table (`src/magnetic.rs`), applied where
# the filter places its origin. On by default, since a declination nobody set is a standing bias
# on every magnetic heading; off, the table's flash is not linked and declination is the
# caller's alone. No dependency either way.
magnetic-model = []

[dev-dependencies]
# `replay --derive` reads a time constant off a logarithm, and the `Config` it prints is pinned
# by a test (`data/flight.config.rs`), so the logarithm is `libm`'s, the same on every host,
# as the filter's transcendentals are. Already in the graph under nalgebra's `libm` feature.
libm = "0.2.16"

# The adversarial suite (`src/eskf/adversarial.rs`, #44): generated hostile inputs, shrunk to
# the shortest failing sequence. Test-only, so the `no_std` build and its one dependency are
# untouched; hosted targets only, because examples take dev-dependencies too and
# `examples/embedded.rs` builds for bare metal. `no_std` rather than `std`: proptest's `std`
# turns on `num-traits/std`, which swaps nalgebra's transcendentals from `libm` to the
# platform's in every test and example build, and moved `flight.csv` in the last digit.
# The trace `replay --trace` writes for #41's board, only in the build `data/onboard.sh` makes
# with `--cfg fusion_nav_onboard`: `onboard` is an unpublished member, which the packaged crate
# cannot carry, so the default harness drives `Eskf` without it (`examples/replay/filter.rs`).
[target.'cfg(fusion_nav_onboard)'.dev-dependencies]
onboard = { path = "onboard" }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["alloc", "no_std"] }

# The harness reports the crate's magnetic model beside a log's own declination
# (`declination_model=`), so it needs the model built in.
[[example]]
name = "replay"
path = "examples/replay/main.rs"
required-features = ["magnetic-model"]

# `fusion_nav_onboard` is the replay harness's switch to its traced build (`examples/replay/filter.rs`);
# `docsrs` is docs.rs's, set by `[package.metadata.docs.rs]`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fusion_nav_onboard)", "cfg(docsrs)"] }
