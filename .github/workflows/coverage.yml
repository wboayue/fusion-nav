name: coverage

# After CI passes on main, line coverage of `src/` to Coveralls. Flags live in `tarpaulin.toml`,
# so a local `cargo tarpaulin` measures the same thing. The upload names the branch and commit
# itself: a `workflow_run` checks out a detached `head_sha`, and tarpaulin's own `--coveralls`
# then files the build under no branch, which leaves the README's `?branch=main` badge unknown.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - run: cargo tarpaulin --out Lcov
      # The token both ways: the action's input and the reporter's own variable.
      - uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: lcov.info
          format: lcov
          git-branch: ${{ github.event.workflow_run.head_branch }}
          git-commit: ${{ github.event.workflow_run.head_sha }}
