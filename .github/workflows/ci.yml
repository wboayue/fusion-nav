name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --no-deps
      - run: cargo clippy --all-targets --no-deps --features defmt
      # Without the magnetic model, whose absence changes what `Eskf::place_origin` reads.
      - run: cargo clippy --all-targets --no-deps --no-default-features
      # The benchmark member, which no root build selects.
      - run: cargo clippy -p bench --all-targets --no-deps
      # `tools/check-anchors.sh` owns what this checks and why; its fixtures run first for
      # the reason `data/expect.sh --self-test` does below. The README's snippets are
      # checked by `cargo test --doc`, through the `include_str!` in `src/lib.rs`.
      - run: tools/check-anchors.sh --self-test
      - run: tools/check-anchors.sh
      # The page renderer's fixtures, stdlib only, and the one page that needs no replay:
      # validation/cost.md shows data/footprint.txt's pins, so a re-pin left off it fails here
      # rather than behind the footprint job's nightly build (validation/README.md).
      - run: python3 tools/validation.py --self-test
      - run: python3 tools/validation.py check validation/src target/validation . --only cost.md
      # The declination generator's fixtures, stdlib only: generating needs `pygeomag` and is
      # local, but a broken lookup, log reader or drift maximum would misreport `--drift` with
      # nothing else to notice.
      - run: python3 tools/declination.py --self-test

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo test --lib --no-default-features
      # Smoke-test the replay harness end to end. No hardware, no ROS, no PX4 tooling.
      - run: cargo run --example replay
      # Accuracy against the simulator's analytic truth, per scenario, against the ceilings in
      # `data/scenarios.txt`. The comparator runs its own fixtures first so that a broken
      # comparison fails as itself rather than as a filter regression -- `data/scenarios.txt`
      # was produced by the harness it guards, the same circularity `examples/replay/main.rs`
      # answers with its own tests.
      - run: data/expect.sh --self-test
      - run: data/bench.sh
      # The host benchmarks, each run once: they keep building, and each asserts the call it
      # times is fused rather than refused. Timings are not gated on a shared runner (#42).
      - run: cargo test -p bench --benches

  anees:
    name: anees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The covariance against its chi-square bound, each scenario flown on fifty seeds (#89).
      # A job of its own rather than a step after bench.sh: it builds release and runs 500
      # replays, and neither gate should wait on the other. The aggregator's fixtures run first
      # for the reason bench.sh's comparator's do.
      - run: python3 tools/anees.py --self-test
      - run: data/anees.sh

  embedded:
    name: no_std build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv7em-none-eabihf, thumbv6m-none-eabi]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target ${{ matrix.target }}
      # The integration a reader copies, built as a program: a `std` call in it is a build
      # error here. Then both again under `defmt`, whose impls nothing else compiles.
      - run: cargo build --example embedded --target ${{ matrix.target }}
      - run: cargo build --lib --features defmt --target ${{ matrix.target }}
      - run: cargo build --example embedded --features defmt --target ${{ matrix.target }}
      - run: cargo build --lib --no-default-features --target ${{ matrix.target }}

  # What the filter costs a bare-metal target: type sizes, stack frames and flash, pinned
  # exactly in `data/footprint.txt` (#42). The nightly is the script's, so CI and a laptop
  # measure with one compiler; `tools/footprint.sh` owns why, and how each figure is taken.
  footprint:
    name: footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/footprint.sh --install
      # Keyed on the script, which pins the nightly: a new nightly's build shares nothing with
      # the old one's.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('tools/footprint.sh') }}
      # The comparator and the parser fail as themselves before either reads a measurement.
      - run: data/expect.sh --self-test
      - run: python3 tools/footprint.py --self-test
      - run: tools/footprint.sh

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib

  # Replay is the regression guard for every later stage: #32 asserts a stage wired nothing
  # in by diffing `target/replay.csv` byte for byte, and that diff only means anything if the
  # bytes depend on the input and not on the host. Both runners produce the same file because
  # the filter's transcendentals come from the `libm` crate (pure Rust, via nalgebra with
  # `default-features = false`), Rust contracts no FMAs, and everything else is IEEE-exact —
  # so a difference here is a real one. `data/README.md` records what a mismatch means.
  determinism:
    name: replay determinism (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm # a native aarch64 runner: no emulation, no cross-compilation
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Twice on one host before comparing hosts, so a cross-architecture mismatch cannot be
      # blamed on a replay that is not repeatable in the first place.
      - run: |
          cargo run --example replay -- data/flight.csv target/replay-1.csv
          cargo run --example replay -- data/flight.csv target/replay-2.csv
          cmp target/replay-1.csv target/replay-2.csv
          sha256sum target/replay-1.csv | cut -d ' ' -f 1 | tee replay.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: replay-hash-${{ matrix.arch }}
          path: replay.sha256

  determinism-compare:
    name: replay determinism (compare)
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-hash-*
          path: hashes
      - run: |
          x86=$(cat hashes/replay-hash-x86_64/replay.sha256)
          arm=$(cat hashes/replay-hash-aarch64/replay.sha256)
          echo "x86_64  $x86"
          echo "aarch64 $arm"
          if [ "$x86" != "$arm" ]; then
            echo "::error::replay output depends on the host architecture; see data/README.md"
            exit 1
          fi

  # `src/` has no `unwrap`, `expect`, `panic!` or `unreachable!` outside `#[cfg(test)]`, and
  # #31's stages are about to add matrix arithmetic where `try_inverse` returns an `Option`
  # somebody will unwrap. On `thumbv6m` a panic is a `udf` instruction and the vehicle is a
  # brick, so the invariant is checked rather than remembered: `panic-check/run.sh` links the
  # whole public API for a bare-metal target and fails on a surviving reference to
  # `core::panicking`. README.md, "The library cannot panic", owns what that does and does not
  # cover.
  panic:
    name: cannot panic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - run: panic-check/run.sh
